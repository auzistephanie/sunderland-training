<!DOCTYPE html>
<html lang="zh-Hant-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunderland HK 自學課程</title><style>
:root{--bg:#fff7ef;--card:#fff;--ink:#3a2a20;--muted:#8a6f5e;--pri:#e8672c;--pri2:#f4a03a;--ok:#2f9e6a;--bad:#d6453d;--warn:#fff1c9;--line:#f1dccb;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:10px 16px 12px;box-shadow:0 2px 10px #e8672c44}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.top b{font-size:16px}
.pill{background:#ffffff33;border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill button{background:none;border:0;color:#fff;font-size:14px;cursor:pointer;padding:0 0 0 4px}
.bar{height:8px;background:#ffffff44;border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .4s}
main{max-width:560px;margin:0 auto;padding:16px 16px 90px}
section{display:none;animation:in .35s}
section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
h2{margin:6px 0 4px;font-size:22px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.box{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 16px #c9824a1f;margin-bottom:14px}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;font-family:inherit}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fffaf5ee;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .row{max-width:560px;margin:0 auto}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.steps span{font-size:12px;padding:3px 9px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.steps span.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.steps span.cur{border-color:var(--pri);color:var(--pri);font-weight:700}
a{color:var(--pri)}
.src{font-size:12px;margin-top:8px}
.src a{margin-right:6px}
.warn{background:var(--warn);border-left:4px solid #e0a800;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
/* flip cards */
.deck{perspective:1000px;height:300px;position:relative;touch-action:pan-y}
.fc{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 8px 24px #c9824a33}
.front{background:linear-gradient(150deg,#ffb36b,#e8672c);color:#fff}
.front .q{font-size:22px;font-weight:700}
.front .hint{margin-top:auto;font-size:13px;opacity:.85}
.back{background:#fff;transform:rotateY(180deg);overflow:auto}
.back .a{font-size:17px}
.tag{font-size:12px;opacity:.85;margin-bottom:8px}
.dots{display:flex;justify-content:center;gap:5px;margin:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pri);width:18px;border-radius:9px}
/* match */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;cursor:grab;user-select:none;touch-action:none}
.chip.sel{border-color:var(--pri);background:#ffe9db;transform:scale(1.04)}
.chip.ok{border-color:var(--ok);background:#e5f6ee;cursor:default}
.chip.shake{animation:shake .4s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tier{background:#fff;border:2px dashed var(--pri2);border-radius:16px;padding:10px;min-height:110px}
.tier h4{margin:0 0 6px;font-size:15px;color:var(--pri)}
.tier.hover{background:#fff1e6}
.tier .chip{font-size:12px;padding:5px 7px;margin:3px 0;display:block}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:15px;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt.right{border-color:var(--ok);background:#e5f6ee}
.opt.wrong{border-color:var(--bad);background:#fde8e6}
.fb{display:none;margin-top:10px;padding:12px;border-radius:12px;font-size:14px}
.fb.show{display:block}
.fb.good{background:#e5f6ee}.fb.nope{background:#fde8e6}
.stat{display:flex;gap:8px;margin-bottom:10px;font-size:14px}
.stat>span{background:#fff;border-radius:99px;padding:4px 10px;border:1px solid var(--line)}
.bubble{background:#eef3ff;border-radius:16px 16px 16px 4px;padding:12px 14px;margin:6px 0 12px;font-size:16px}
/* intro */
.ring{font-size:56px;font-weight:800;text-align:center;color:var(--pri);font-variant-numeric:tabular-nums}
.model{filter:blur(6px);transition:filter .3s;user-select:none}
.model.show{filter:none;user-select:auto}
.check label{display:block;padding:6px 0;font-size:15px}
/* final */
.badge{width:150px;height:150px;margin:10px auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,#ffe08a,#f4a03a 60%,#e8672c);color:#fff;font-weight:800;box-shadow:0 0 0 8px #fff,0 0 0 12px #f4a03a66;animation:pop .7s}
.badge .e{font-size:48px}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;text-align:center;color:var(--pri)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
ul.tight{padding-left:20px;margin:6px 0}
.guessv{font-size:34px;font-weight:800;text-align:center;color:var(--pri);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--pri);height:30px}
.ord{display:flex;flex-direction:column;gap:8px}
.ord .chip{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.ord .num{background:var(--pri);color:#fff;border-radius:50%;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.say{background:#f3f7ff;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15px}
.me{background:#ffe9db;border-radius:16px 16px 4px 16px;padding:10px 12px;margin:8px 0 8px 30px;font-size:15px}
.log{max-height:none}
.tiers.c3{grid-template-columns:1fr 1fr 1fr}
.tiers.c1{grid-template-columns:1fr}
.expl{font-size:13px;color:var(--muted);margin:2px 0 6px}
body.home .dayonly{display:none!important}body:not(.home) .homeonly{display:none!important}
.day{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);position:relative}
.dn{min-width:52px;height:52px;border-radius:16px;background:linear-gradient(150deg,#ffb36b,#e8672c);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
.day.ok .dn{background:var(--ok)}.day.soon{opacity:.55}.day.soon .dn{background:#cdb8a8}
.day.today{outline:3px solid var(--pri);box-shadow:0 6px 20px #e8672c44}
.today-tag{position:absolute;top:-9px;right:12px;background:var(--pri);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px}
.dt{flex:1;min-width:0}.dt small{color:var(--muted)}.st{font-size:12px;margin-top:3px}
.mark{font-size:12px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 4px 16px #c9824a1f}.kpi b{display:block;font-size:22px;color:var(--pri)}.kpi small{color:var(--muted);font-size:12px}
</style></head><body>
<header><div class="top"><b id="htitle">Sunderland HK 自學課程</b><span class="pill dayonly">⏱ <span id="clock"></span><button id="tbtn" aria-label="暫停/開始">⏸</button></span><span class="pill dayonly">⭐ <span id="pts">0</span></span><span class="pill homeonly">🔥 <span id="hstreak">0</span> 日</span></div><div class="bar"><i id="prog"></i></div></header>
<main id="home" class="homeonly"></main>
<main id="main" class="dayonly"></main>
<div class="nav dayonly"><div class="row"><button class="btn ghost" id="back">← 返轉頭</button><button class="btn" id="next">下一步 →</button></div></div>

steps.forEach(function(x,i){html+='<section id="s'+(i+1)+'"><h2>'+x.icon+' '+x.name+'</h2>'+(x.sub?'<p class="sub">'+x.sub+'</p>':'')+'<div id="b'+(i+1)+'"></div>'+(x.note?'<div style="margin-top:10px">'+x.note+'</div>':'')+'</section>'});
html+='<section id="s'+(N+1)+'"><h2 style="text-align:center">搞掂 '+D.short+' 🎉</h2><div class="badge" id="badge"></div><div class="big"><span id="fscore">0</span> 分</div><p class="sub" style="text-align:center" id="fsum"></p><div class="box"><b>來源</b><div class="src">'+D.sources.map(function(k){return '<a href="'+U[k]+'" target="_blank" rel="noopener">'+k+'</a>'}).join("｜")+'</div></div><div class="row"><a class="btn ghost" href="#home" style="text-align:center;text-decoration:none">課程目錄</a>'+(D.nextDay?'<a class="btn" href="'+D.nextDay+'" style="text-align:center;text-decoration:none">下一日 →</a>':'')+'</div><p style="text-align:center"><button class="btn ghost" id="again" style="font-size:13px;padding:6px 12px">再玩一次</button></p></section><div class="steps" id="steps"></div>';
main.innerHTML=html;
var names=["開始"].concat(steps.map(function(x){return x.name})).concat(["完成"]);
function go(n){
 st.step=Math.max(0,Math.min(N+1,n));
 document.querySelectorAll("#main>section").forEach(function(s,i){s.classList.toggle("on",i==st.step)});
 $("steps").innerHTML=names.map(function(s,i){return '<span class="'+(i<st.step?"done":i==st.step?"cur":"")+'">'+s+'</span>'}).join("");
 $("back").disabled=st.step==0;$("next").style.visibility=last()?"hidden":"visible";
 $("next").textContent=st.step==N?"睇成績 🏁":"下一步 →";
 if(st.step>0&&!last()){var x=steps[st.step-1];R[x.type](x,S(st.step),$("b"+st.step),st.step)}
 if(last())finish();
 progress();save();window.scrollTo(0,0);
}
function nextStep(){go(st.step+1)}
var R={};
// ---- cards
R.cards=function(x,s,el,idx){
 s.card=s.card||0;s.seen=s.seen||[];
 function draw(){var c=x.items[s.card];
  el.innerHTML='<div class="deck"><div class="fc"><div class="face front"><div class="tag">'+c.t+' · '+(s.card+1)+'/'+x.items.length+'</div><div class="q">'+c.q+'</div><div class="hint">👆 撳一下翻轉</div></div><div class="face back"><div class="tag" style="color:var(--muted)">'+c.t+'</div><div class="a">'+c.a+'</div>'+src(c.s)+'</div></div></div><div class="dots">'+x.items.map(function(_,i){return '<i class="'+(i==s.card?"on":"")+'"></i>'}).join("")+'</div><div class="row"><button class="btn ghost cprev">← 上一張</button><button class="btn cnext">'+(s.card==x.items.length-1?"下一關 →":"下一張 →")+'</button></div>';
  var fc=el.querySelector(".fc");
  fc.onclick=function(e){if(e.target.tagName=="A")return;fc.classList.toggle("flip");if(s.seen.indexOf(s.card)<0){s.seen.push(s.card);addPts(5);if(s.seen.length==x.items.length)complete(idx)}};
  var pv=el.querySelector(".cprev"),nx=el.querySelector(".cnext");pv.disabled=s.card==0;
  pv.onclick=function(){if(s.card>0){s.card--;draw();save()}};
  nx.onclick=function(){if(s.card<x.items.length-1){s.card++;draw();save()}else nextStep()};
  var d=el.querySelector(".deck"),x0=null;d.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});d.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(dx<-50)nx.click();else if(dx>50&&s.card>0)pv.click();x0=null});
 }
 draw();
};
// ---- sort (drag or tap into buckets)
R.sort=function(x,s,el,idx){
 s.placed=s.placed||{};var sel=null;
 el.innerHTML='<div class="box"><div class="pool"></div></div><div class="tiers '+(x.cols?"c"+x.cols:"")+'">'+x.tiers.map(function(t){return '<div class="tier" data-t="'+t[0]+'"><h4>'+t[1]+'</h4></div>'}).join("")+'</div><div class="explbox"></div><p class="sub mmsg" style="text-align:center"></p>';
 var pool=el.querySelector(".pool"),eb=el.querySelector(".explbox");
 function tierEl(t){return el.querySelector('.tier[data-t="'+t+'"]')}
 function msg(){var n=Object.keys(s.placed).length;el.querySelector(".mmsg").textContent=n==x.items.length?(x.doneMsg||"🎉 全部啱晒！"):"已放 "+n+"/"+x.items.length}
 function addExpl(i){var it=x.items[i];if(!it[2])return;var d=document.createElement("div");d.className="box";d.style.fontSize="14px";d.innerHTML="<b>"+it[0]+"</b> → "+it[2]+src(it[3]);eb.appendChild(d)}
 var order=x.items.map(function(_,i){return i});order.sort(function(a,b){return ((a*7+3)%x.items.length)-((b*7+3)%x.items.length)||a-b});
 order.forEach(function(i){var c=document.createElement("div");c.className="chip";c.textContent=x.items[i][0];c.dataset.i=i;
  if(s.placed[i]){c.classList.add("ok");tierEl(x.items[i][1]).appendChild(c);return}pool.appendChild(c);bind(c)});
 x.items.forEach(function(_,i){if(s.placed[i])addExpl(i)});
 el.querySelectorAll(".tier").forEach(function(t){t.onclick=function(){if(sel)drop(sel,t)}});
 msg();
 function drop(c,t){var i=+c.dataset.i;
  if(x.items[i][1]==t.dataset.t){c.classList.remove("sel","shake");c.classList.add("ok");c.style.cssText="";t.appendChild(c);c.onclick=null;c.onpointerdown=null;s.placed[i]=1;addPts(10);toast("✅ 啱！+10");addExpl(i);msg();if(Object.keys(s.placed).length==x.items.length){complete(idx);confetti(60)}}
  else{c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");c.addEventListener("animationend",function(){c.classList.remove("shake")},{once:true});toast(x.wrongMsg||"唔啱喎，再諗下 🤔")}
  sel=null}
 function bind(c){
  c.onclick=function(e){e.stopPropagation();el.querySelectorAll(".chip.sel").forEach(function(z){z.classList.remove("sel")});sel=c;c.classList.add("sel")};
  c.onpointerdown=function(e){var sx=e.clientX,sy=e.clientY,mv=false,r=c.getBoundingClientRect();
   function m(ev){var dx=ev.clientX-sx,dy=ev.clientY-sy;if(!mv&&Math.abs(dx)+Math.abs(dy)<8)return;mv=true;c.style.position="fixed";c.style.left=(r.left+dx)+"px";c.style.top=(r.top+dy)+"px";c.style.width=r.width+"px";c.style.zIndex=99;c.style.pointerEvents="none";el.querySelectorAll(".tier").forEach(function(t){t.classList.remove("hover")});var u=document.elementFromPoint(ev.clientX,ev.clientY),t=u&&u.closest(".tier");if(t)t.classList.add("hover")}
   function up(ev){document.removeEventListener("pointermove",m);document.removeEventListener("pointerup",up);el.querySelectorAll(".tier").forEach(function(t){t.classList.remove("hover")});if(!mv)return;var u=document.elementFromPoint(ev.clientX,ev.clientY),t=u&&u.closest(".tier");c.style.cssText="";if(t)drop(c,t)}
   document.addEventListener("pointermove",m);document.addEventListener("pointerup",up)}
 }
};
// ---- quiz
R.quiz=function(x,s,el,idx){
 s.i=s.i||0;s.ans=s.ans||[];s.streak=s.streak||0;s.best=s.best||0;
 function draw(){
  var head='<div class="stat"><span>第 <b>'+Math.min(s.i+1,x.items.length)+'</b>/'+x.items.length+' 題</span><span>🔥 連勝 <b>'+s.streak+'</b></span></div>';
  if(s.i>=x.items.length){var c=s.ans.filter(Boolean).length;el.innerHTML=head+'<div class="box"><div class="big">'+c+'/'+x.items.length+'</div><p style="text-align:center">最長連勝 🔥 '+s.best+'</p><button class="btn full qdone">下一關 →</button></div>';el.querySelector(".qdone").onclick=nextStep;return}
  var q=x.items[s.i];
  el.innerHTML=head+'<div class="box"><b style="font-size:17px">'+q.q+'</b>'+q.o.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+o+'</button>'}).join("")+'<div class="fb"></div></div>';
  el.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){ans(+b.dataset.j)}});
 }
 function ans(j){var q=x.items[s.i],ok=j==q.a;
  el.querySelectorAll(".opt").forEach(function(b,k){b.disabled=true;if(k==q.a)b.classList.add("right");else if(k==j)b.classList.add("wrong")});
  if(ok){s.streak++;s.best=Math.max(s.best,s.streak);addPts(20+(s.streak>=3?5:0))}else s.streak=0;
  s.ans.push(ok);s.i++;if(s.i>=x.items.length)complete(idx);save();
  var fb=el.querySelector(".fb");fb.className="fb show "+(ok?"good":"nope");
  fb.innerHTML=(ok?"✅ 啱！+20"+(s.streak>=3?"（🔥 連勝 +5）":""):"❌ 差少少")+"<br>"+q.e+src(q.s)+'<button class="btn full qnext" style="margin-top:10px">'+(s.i>=x.items.length?"睇結果":"下一題 →")+'</button>';
  el.querySelector(".qnext").onclick=draw;if(ok&&s.streak>=3)confetti(25)}
 draw();
};
// ---- guess (slider)
R.guess=function(x,s,el,idx){
 s.i=s.i||0;s.res=s.res||[];
 function f(v){return x.prefix+Number(v).toLocaleString("en-US")+(x.suffix||"")}
 function draw(){
  if(s.i>=x.items.length){var tot=s.res.reduce(function(a,b){return a+b},0);el.innerHTML='<div class="box"><div class="big">'+tot+' 分</div><p style="text-align:center">'+x.items.length+' 題估完 💰</p><button class="btn full gdone">下一關 →</button></div>';el.querySelector(".gdone").onclick=nextStep;return}
  var q=x.items[s.i],mid=Math.round((q.min+q.max)/2/q.step)*q.step;
  el.innerHTML='<div class="stat"><span>第 <b>'+(s.i+1)+'</b>/'+x.items.length+' 題</span></div><div class="box"><b style="font-size:17px">'+q.q+'</b><div class="guessv">'+f(mid)+'</div><input type="range" min="'+q.min+'" max="'+q.max+'" step="'+q.step+'" value="'+mid+'"><div class="row" style="font-size:12px;color:var(--muted)"><span>'+f(q.min)+'</span><span style="text-align:right">'+f(q.max)+'</span></div><button class="btn full gok" style="margin-top:10px">就係呢個價！</button><div class="fb"></div></div>';
  var r=el.querySelector("input"),v=el.querySelector(".guessv");r.oninput=function(){v.textContent=f(r.value)};
  el.querySelector(".gok").onclick=function(){var g=+r.value,diff=Math.abs(g-q.ans)/q.ans,p=diff==0?25:diff<=.05?20:diff<=.15?10:3;
   r.disabled=true;this.disabled=true;s.res.push(p);addPts(p);s.i++;if(s.i>=x.items.length)complete(idx);save();
   var fb=el.querySelector(".fb");fb.className="fb show "+(diff<=.05?"good":"nope");
   fb.innerHTML=(diff==0?"🎯 一蚊都唔差！":diff<=.05?"👍 好接近！":diff<=.15?"🙂 差少少":"😅 差得遠喎")+" +"+p+"<br>答案："+f(q.ans)+"<br>"+q.e+src(q.s)+'<button class="btn full gnext" style="margin-top:10px">'+(s.i>=x.items.length?"睇結果":"下一題 →")+'</button>';
   el.querySelector(".gnext").onclick=draw;if(diff==0)confetti(20)}
 }
 draw();
};
// ---- order (tap in sequence)
R.order=function(x,s,el,idx){
 s.n=s.n||0;
 el.innerHTML='<div class="box"><b>撳嘅次序：</b><div class="ord done"></div></div><div class="box"><div class="ord pool2"></div></div><div class="fb"></div>';
 var dn=el.querySelector(".done"),pl=el.querySelector(".pool2");
 function put(i){var d=document.createElement("div");d.className="chip ok";d.innerHTML='<span class="num">'+(i+1)+'</span><span><b>'+x.items[i][0]+'</b>'+(x.items[i][1]?'<div class="expl">'+x.items[i][1]+'</div>':'')+src(x.items[i][2])+'</span>';dn.appendChild(d)}
 for(var i=0;i<s.n;i++)put(i);
 var ord=x.items.map(function(_,i){return i});ord.sort(function(a,b){return ((a*3+1)%x.items.length)-((b*3+1)%x.items.length)||a-b});
 ord.forEach(function(i){if(i<s.n)return;var c=document.createElement("div");c.className="chip";c.dataset.i=i;c.textContent=x.items[i][0];pl.appendChild(c);
  c.onclick=function(){if(+c.dataset.i==s.n){c.remove();put(s.n);s.n++;addPts(10);toast("✅ 啱！+10");save();if(s.n==x.items.length)fin()}else{c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");c.addEventListener("animationend",function(){c.classList.remove("shake")},{once:true});toast("未到呢步住 🤔")}}});
 function fin(){complete(idx);confetti(50);var fb=el.querySelector(".fb");fb.className="fb show good";fb.innerHTML=x.doneMsg||"🎉 次序啱晒！"}
 if(s.n==x.items.length){var fb=el.querySelector(".fb");fb.className="fb show good";fb.innerHTML=x.doneMsg||"🎉 次序啱晒！"}
};
// ---- branching role-play
R.branch=function(x,s,el,idx){
 s.node=s.node||x.start;s.log=s.log||[];s.tried=s.tried||{};
 function draw(){
  var n=x.nodes[s.node];
  var h='<div class="log">'+s.log.join("")+'</div>';
  h+='<div class="say">'+n.who+'：'+n.text+'</div>';
  if(n.end){h+='<div class="fb show good">'+n.end+src(n.s)+'</div>';el.innerHTML=h;if(!S(idx).c){complete(idx);addPts(20);confetti(40)}return}
  h+='<p class="sub" style="margin:4px 0">你會點覆？</p>'+n.opts.map(function(o,j){var t=s.tried[s.node+":"+j];return '<button class="opt'+(t?" wrong":"")+'" data-j="'+j+'"'+(t?" disabled":"")+'>'+o.t+'</button>'}).join("")+'<div class="fb"></div>';
  el.innerHTML=h;
  el.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.j)}});
 }
 function pick(j){var n=x.nodes[s.node],o=n.opts[j],fb=el.querySelector(".fb");
  if(o.ok){addPts(o.pts||15);el.querySelectorAll(".opt").forEach(function(b){b.disabled=true});el.querySelectorAll(".opt")[j].classList.add("right");
   fb.className="fb show good";fb.innerHTML="✅ "+o.fb+src(o.s)+'<button class="btn full bnext" style="margin-top:10px">繼續 →</button>';
   el.querySelector(".bnext").onclick=function(){s.log.push('<div class="say">'+n.who+'：'+n.text+'</div><div class="me">你：'+o.t+'</div>');s.node=o.go;save();draw()}}
  else{s.tried[s.node+":"+j]=1;save();el.querySelectorAll(".opt")[j].classList.add("wrong");el.querySelectorAll(".opt")[j].disabled=true;fb.className="fb show nope";fb.innerHTML="🤏 "+o.fb+src(o.s)+"<br>再揀過。"}
 }
 draw();
};
// ---- practice (countdown + checklist + model)
R.practice=function(x,s,el,idx){
 s.ck=s.ck||{};var T=null,n=x.sec;
 el.innerHTML='<div class="box">'+(x.prompt?'<p style="margin-top:0">'+x.prompt+'</p>':'')+'<div class="ring">'+fmtS(n)+'</div><div class="row"><button class="btn cgo">開始倒數</button><button class="btn ghost crs">重置</button></div></div><div class="box check"><b>講完自己剔一剔：</b>'+x.checks.map(function(c,i){return '<label><input type="checkbox" class="ck" data-i="'+i+'"'+(s.ck[i]?" checked":"")+'> '+c+'</label>'}).join("")+'</div>'+(x.model?'<div class="box"><b>參考答案</b> <button class="btn ghost smodel" style="font-size:13px;padding:5px 10px;margin-left:6px">👀 睇答案</button><div class="model">'+x.model+'</div>'+src(x.s)+'</div>':'');
 function fmtS(v){return v>=60?fmt(v):String(v)}
 var ring=el.querySelector(".ring");
 el.querySelector(".cgo").onclick=function(){if(T)return;n=x.sec;ring.textContent=fmtS(n);ring.style.color="";T=setInterval(function(){n--;ring.textContent=fmtS(n);if(n<=5)ring.style.color="var(--bad)";if(n<=0){clearInterval(T);T=null;ring.textContent="完 👏";if(!s.c){addPts(20);complete(idx)}}},1000)};
 el.querySelector(".crs").onclick=function(){clearInterval(T);T=null;n=x.sec;ring.textContent=fmtS(n);ring.style.color=""};
 var sm=el.querySelector(".smodel");if(sm)sm.onclick=function(){var m=el.querySelector(".model");m.classList.toggle("show");sm.textContent=m.classList.contains("show")?"🙈 收埋":"👀 睇答案"};
 el.querySelectorAll(".ck").forEach(function(c){c.onchange=function(){var i=c.dataset.i;if(c.checked&&!s.ck[i]){s.ck[i]=1;addPts(4)}save()}});
};
function finish(){
 var B=D.badges,b=st.pts>=B[0][0]?B[0]:st.pts>=B[1][0]?B[1]:B[2];
 $("fscore").textContent=st.pts;$("badge").innerHTML='<span class="e">'+b[1]+'</span><span>'+b[2]+'</span>';
 var c=0;for(var i=0;i<N;i++)if(S(i+1).c)c++;
 $("fsum").innerHTML="完成 "+c+"/"+N+" 關 · 用咗 "+fmt(TOTAL-st.time)+(D.nextDay?"<br>"+D.bye:"<br>"+D.bye);
 if(!st.done){st.done=true;st.doneDate=todayISO()}st.marked=false;st.score=st.pts;save();confetti(120);
}
$("tbtn").onclick=function(){st.run=!st.run;tick();save()};
$("next").onclick=nextStep;$("back").onclick=function(){go(st.step-1)};
$("startBtn").onclick=function(){go(1)};
function reset(){localStorage.removeItem(KEY);mount(D)}
$("resetBtn").onclick=reset;$("again").onclick=reset;
$("pts").textContent=st.pts;tick();go(st.step);
}

var C=window.COURSE;
function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function streak(){var set={};C.forEach(function(d){var s=ld(d.key);if(s&&s.done&&s.doneDate)set[s.doneDate]=1});
 var d=new Date(),n=0;if(!set[todayISO()])d.setDate(d.getDate()-1);
 while(true){var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(!set[k])break;n++;d.setDate(d.getDate()-1)}return n}
function home(){
 clearInterval(TIMER);document.body.classList.add("home");document.getElementById("htitle").textContent="Sunderland HK 自學課程";
 var t=todayISO(),done=0,pts=0,avail=0;
 var rows=C.map(function(d){var s=ld(d.key);if(!d.soon)avail++;if(s&&s.done){done++;pts+=(s.score||0)}
  var cls="box day"+(s&&s.done?" ok":"")+(d.soon?" soon":"")+(d.iso==t?" today":"");
  var st=d.soon?"🔒 Coming soon":s&&s.done?(s.marked?"✅ 已標記完成":"✅ 完成 · "+s.score+" 分"):s&&s.step>0?"⏳ 做緊":"未開始";
  var btn=(!d.soon&&!(s&&s.done))?'<button class="mark" data-k="'+d.key+'">✔ 我做咗喇</button>':'';
  var inner=(d.iso==t?'<span class="today-tag">今日</span>':'')+'<div class="dn">D'+d.n+'</div><div class="dt"><b>'+d.title+'</b><br><small>'+d.date+(d.minutes?' · '+d.minutes+' 分鐘':'')+'</small><div class="st">'+st+'</div></div>'+btn;
  return d.soon?'<div class="'+cls+'">'+inner+'</div>':'<a class="'+cls+'" href="#day'+d.n+'" id="card'+d.n+'">'+inner+'</a>'});
 var pct=Math.round(done/C.length*100);document.getElementById("prog").style.width=pct+"%";var sk=streak();document.getElementById("hstreak").textContent=sk;
 document.getElementById("home").innerHTML='<section class="on"><h2>自學課程 📚</h2><p class="sub">每日大約 15 分鐘，一日一課。</p><div class="kpis"><div class="kpi"><b>'+done+'/'+C.length+'</b><small>總進度 '+pct+'%</small></div><div class="kpi"><b>'+pts+'</b><small>總分</small></div><div class="kpi"><b>🔥 '+sk+'</b><small>連續日數</small></div></div>'+rows.join("")+'</section>';
 document.querySelectorAll(".mark").forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();var s=ld(b.dataset.k)||{};s.done=true;s.marked=true;s.doneDate=todayISO();s.step=s.step||0;localStorage.setItem(b.dataset.k,JSON.stringify(s));home()}});
 window.scrollTo(0,0);
 var td=document.querySelector(".day.today");if(td&&td.getBoundingClientRect().top>window.innerHeight-80)td.scrollIntoView({block:"center"});
}
function route(){var m=location.hash.match(/^#day(\d+)$/);var d=m&&C[+m[1]-1];
 if(d&&!d.soon){document.body.classList.remove("home");mount(d)}else home()}
window.addEventListener("hashchange",route);route();
</script></body></html>
